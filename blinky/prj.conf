CONFIG_GPIO=y
# Keep the application address aligned with the board overlay's flash layout.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_SUM_LOG=y
CONFIG_I2C=y
CONFIG_SENSOR=y
# UART1 and I2C1 share peripheral instance 1. Release TF-M's secure UART
# so the non-secure application can use I2C1. UART0 console remains enabled.
CONFIG_TFM_LOG_LEVEL_SILENCE=y
CONFIG_TFM_SECURE_UART=n
